<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deep Learning — Quizzes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- NAV -->
  <nav class="navbar">
    <div class="nav-inner">
      <span class="nav-logo">DL<span class="accent">.</span>Quiz</span>
      <div class="nav-links">
        <a href="index.html" class="nav-link">MCQ</a>
        <a href="quizzes.html" class="nav-link active">Quizzes</a>
      </div>
    </div>
  </nav>

  <!-- HERO -->
  <header class="hero" id="heroSection">
    <div class="hero-label">Official Quizzes</div>
    <h1 class="hero-title">الكويزات الرسمية<br /><span class="accent">اختبر نفسك</span></h1>
    <p class="hero-sub">اختار الكويز اللي عايز تذاكره وجاوب على الأسئلة — هتعرف نتيجتك في الآخر.</p>
  </header>

  <!-- QUIZ SELECTOR -->
  <section class="quiz-selector-section" id="selectorSection">
    <div class="container">
      <p class="section-label">اختار الكويز</p>
      <div class="quiz-list" id="quizList"></div>
    </div>
  </section>

  <!-- QUIZ AREA -->
  <main class="container" id="quizArea" style="display:none;">

    <!-- Progress bar -->
    <div class="progress-wrap">
      <div class="progress-meta">
        <span id="progressLabel">سؤال 1 من 10</span>
        <span id="progressScore">0 صح</span>
      </div>
      <div class="progress-bar-track">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- Question card -->
    <div class="question-card" id="questionCard">
      <div class="question-week-tag" id="questionWeekTag"></div>
      <p class="question-text" id="questionText"></p>
      <div class="options-grid" id="optionsGrid"></div>
      <div class="feedback-box" id="feedbackBox" style="display:none;"></div>
      <button class="btn-next" id="btnNext" style="display:none;">السؤال التالي ←</button>
    </div>

  </main>

  <!-- RESULT SCREEN -->
  <div class="result-screen" id="resultScreen" style="display:none;">
    <div class="result-card" id="resultCard">
      <div class="result-icon" id="resultIcon"></div>
      <h2 class="result-title" id="resultTitle"></h2>
      <div class="result-score" id="resultScore"></div>
      <p class="result-msg" id="resultMsg"></p>
      <div class="result-breakdown" id="resultBreakdown"></div>
      <div class="result-actions">
        <button class="btn-primary" id="btnRetry">حاول تاني</button>
        <button class="btn-secondary" id="btnBackQuizzes">اختار كويز تاني</button>
      </div>
    </div>
  </div>

  <script src="main.js"></script>
  <script>
    // =====================
    //  DATA — placeholder
    // =====================
    const QUIZZES_DATA = [
      {
        id: 1,
        title: "Quiz 1",
        subtitle: "Week 1 & Week 2",
        date: "6 يونيو 2026",
        duration: "20 دقيقة",
        available: true,
        questions: [
          {
            id: 1,
            question: "Which of the following best describes a neural network?",
            options: [
              "A set of if-else rules programmed manually",
              "A system of interconnected nodes inspired by the human brain",
              "A database of labeled examples",
              "A type of sorting algorithm"
            ],
            answer: 1,
            explanation: "A neural network is a computational model inspired by biological neurons, consisting of layers of interconnected nodes that learn patterns from data."
          },
          {
            id: 2,
            question: "What does the term 'epoch' mean in deep learning training?",
            options: [
              "One forward pass through a single sample",
              "One complete pass through the entire training dataset",
              "One update of the model weights",
              "One layer of the neural network"
            ],
            answer: 1,
            explanation: "An epoch is one complete pass through the entire training dataset. Training usually involves multiple epochs."
          },
          {
            id: 3,
            question: "Which activation function outputs values between 0 and 1?",
            options: [
              "ReLU",
              "Tanh",
              "Sigmoid",
              "Leaky ReLU"
            ],
            answer: 2,
            explanation: "The Sigmoid function outputs values in the range (0, 1), making it useful for binary classification output layers."
          },
          {
            id: 4,
            question: "What problem does the ReLU activation function help solve?",
            options: [
              "Overfitting",
              "Vanishing gradient problem",
              "Data imbalance",
              "High learning rate"
            ],
            answer: 1,
            explanation: "ReLU (Rectified Linear Unit) helps mitigate the vanishing gradient problem by allowing gradients to flow through the network for positive values."
          },
          {
            id: 5,
            question: "In supervised learning, what is required to train a model?",
            options: [
              "Unlabeled data only",
              "Labeled input-output pairs",
              "A reward signal",
              "No data — only rules"
            ],
            answer: 1,
            explanation: "Supervised learning requires labeled data — pairs of inputs and their corresponding correct outputs — to train the model."
          }
        ]
      },
      {
        id: 2,
        title: "Quiz 2",
        subtitle: "Week 3",
        date: "6 يونيو 2026",
        duration: "15 دقيقة",
        available: true,
        questions: [
          {
            id: 1,
            question: "What is the vanishing gradient problem?",
            options: [
              "Gradients become too large during backpropagation",
              "Gradients become extremely small, slowing learning in early layers",
              "The model loses its training data",
              "The loss function returns zero"
            ],
            answer: 1,
            explanation: "The vanishing gradient problem occurs when gradients shrink exponentially as they propagate back through many layers, making early layers learn very slowly."
          },
          {
            id: 2,
            question: "Which optimizer uses adaptive learning rates for each parameter?",
            options: [
              "SGD",
              "Batch Gradient Descent",
              "Adam",
              "Perceptron"
            ],
            answer: 2,
            explanation: "Adam (Adaptive Moment Estimation) adapts the learning rate for each parameter individually, combining the benefits of RMSProp and momentum."
          }
        ]
      },
      {
        id: 3,
        title: "Quiz 3",
        subtitle: "Week 4",
        date: "6 يونيو 2026",
        duration: "10 دقائق",
        available: true,
        questions: [
          {
            id: 1,
            question: "What is dropout in neural networks?",
            options: [
              "Removing entire layers from the model",
              "Randomly deactivating neurons during training to prevent overfitting",
              "Reducing the learning rate",
              "Removing outliers from the dataset"
            ],
            answer: 1,
            explanation: "Dropout randomly sets a fraction of neuron outputs to zero during each training step, acting as a regularization technique to prevent overfitting."
          }
        ]
      },
      {
        id: 4,
        title: "Quiz 4",
        subtitle: "Week 5 — CNN Part 1",
        date: "27 يونيو 2026",
        duration: "10 دقائق",
        available: true,
        questions: [
          {
            id: 1,
            question: "What is the main advantage of Convolutional Neural Networks (CNNs) over fully connected networks for image data?",
            options: [
              "CNNs require more parameters",
              "CNNs exploit spatial locality and parameter sharing",
              "CNNs don't use backpropagation",
              "CNNs only work on grayscale images"
            ],
            answer: 1,
            explanation: "CNNs use local filters that share parameters across the entire image, dramatically reducing the number of parameters and exploiting spatial structure."
          },
          {
            id: 2,
            question: "What does a pooling layer do in a CNN?",
            options: [
              "Adds more features to the input",
              "Increases the spatial dimensions",
              "Reduces spatial dimensions while retaining important features",
              "Applies activation functions"
            ],
            answer: 2,
            explanation: "Pooling layers downsample feature maps, reducing spatial dimensions and computation while preserving the most important spatial features."
          }
        ]
      },
      {
        id: 5,
        title: "Quiz 5",
        subtitle: "Week 6 — CNN Part 2",
        date: "20 يونيو 2026",
        duration: "10 دقائق",
        available: true,
        questions: [
          {
            id: 1,
            question: "What is transfer learning?",
            options: [
              "Training a model from scratch on new data",
              "Using a pre-trained model's weights as a starting point for a new task",
              "Transferring data between servers",
              "Moving a model between frameworks"
            ],
            answer: 1,
            explanation: "Transfer learning uses knowledge gained from training on one task/dataset and applies it to a different but related task, saving time and data."
          }
        ]
      },
      {
        id: 6,
        title: "Quiz 6",
        subtitle: "Week 7 — RNN",
        date: "29 يونيو 2026",
        duration: "متاح ليوم كامل",
        available: true,
        questions: [
          {
            id: 1,
            question: "What makes Recurrent Neural Networks (RNNs) different from feedforward networks?",
            options: [
              "RNNs have no hidden layers",
              "RNNs have connections that loop back, giving them memory of previous inputs",
              "RNNs only process images",
              "RNNs use no activation functions"
            ],
            answer: 1,
            explanation: "RNNs have recurrent connections that pass information from one time step to the next, allowing them to model sequential data and temporal dependencies."
          },
          {
            id: 2,
            question: "What problem do LSTMs solve that standard RNNs struggle with?",
            options: [
              "Overfitting",
              "Long-term dependencies — remembering information over many time steps",
              "High computational cost",
              "Image classification"
            ],
            answer: 1,
            explanation: "LSTMs (Long Short-Term Memory) use gates to control what information is remembered or forgotten, solving the vanishing gradient problem in standard RNNs over long sequences."
          }
        ]
      },
      {
        id: 7,
        title: "Quiz 7",
        subtitle: "Week 8 — Evaluation Metrics",
        date: "27 يونيو 2026",
        duration: "10 دقائق",
        available: true,
        questions: [
          {
            id: 1,
            question: "What does the F1-Score measure?",
            options: [
              "Only accuracy",
              "The harmonic mean of precision and recall",
              "The number of correct predictions",
              "The training loss"
            ],
            answer: 1,
            explanation: "F1-Score is the harmonic mean of Precision and Recall, providing a balanced metric especially useful when classes are imbalanced."
          },
          {
            id: 2,
            question: "When is accuracy NOT a good metric to use?",
            options: [
              "When the dataset is perfectly balanced",
              "When dealing with imbalanced classes",
              "When using binary classification",
              "When the model is simple"
            ],
            answer: 1,
            explanation: "With imbalanced classes (e.g., 95% negative, 5% positive), a model that always predicts negative achieves 95% accuracy but is useless. Use F1, precision, or recall instead."
          }
        ]
      },
      {
        id: "1_lab",
        title: "Quiz 1 Lab",
        subtitle: "Lab 3-4 — Week 1",
        date: "2 مايو 2026",
        duration: "15 دقيقة",
        available: false,
        questions: []
      },
      {
        id: "2_lab",
        title: "Quiz 2 Lab",
        subtitle: "Lab 3-4 — Week 3",
        date: "9 مايو 2026",
        duration: "15 دقيقة",
        available: false,
        questions: []
      },
      {
        id: "3_lab",
        title: "Quiz 3 Lab",
        subtitle: "Lab 4",
        date: "16 مايو 2026",
        duration: "10 دقائق",
        available: false,
        questions: []
      }
    ];

    // =====================
    //  STATE
    // =====================
    let currentQuiz   = null;
    let questions     = [];
    let currentIndex  = 0;
    let score         = 0;
    let answered      = false;
    let wrongAnswers  = [];

    // =====================
    //  BUILD QUIZ LIST
    // =====================
    const quizList = document.getElementById('quizList');

    QUIZZES_DATA.forEach(quiz => {
      const card = document.createElement('div');
      card.className = 'quiz-card' + (quiz.available && quiz.questions.length > 0 ? '' : ' locked');

      card.innerHTML = `
        <div class="quiz-card-left">
          <div class="quiz-card-title">${quiz.title}</div>
          <div class="quiz-card-subtitle">${quiz.subtitle}</div>
          <div class="quiz-card-meta">
            <span>📅 ${quiz.date}</span>
            <span>⏱ ${quiz.duration}</span>
            <span>❓ ${quiz.questions.length} سؤال</span>
          </div>
        </div>
        <div class="quiz-card-right">
          ${quiz.available && quiz.questions.length > 0
            ? `<button class="btn-start-quiz">ابدأ ←</button>`
            : `<span class="locked-badge">${!quiz.available ? 'غير متاح' : 'قريباً'}</span>`
          }
        </div>
      `;

      if (quiz.available && quiz.questions.length > 0) {
        card.querySelector('.btn-start-quiz').addEventListener('click', () => startQuiz(quiz));
      }

      quizList.appendChild(card);
    });

    // =====================
    //  LOGIC
    // =====================
    function startQuiz(quiz) {
      currentQuiz  = quiz;
      questions    = quiz.questions;
      currentIndex = 0;
      score        = 0;
      answered     = false;
      wrongAnswers = [];

      document.getElementById('heroSection').style.display    = 'none';
      document.getElementById('selectorSection').style.display = 'none';
      document.getElementById('resultScreen').style.display    = 'none';
      document.getElementById('quizArea').style.display        = 'block';

      renderQuestion();
    }

    function renderQuestion() {
      answered = false;
      const q     = questions[currentIndex];
      const total = questions.length;

      document.getElementById('progressLabel').textContent   = `سؤال ${currentIndex + 1} من ${total}`;
      document.getElementById('progressScore').textContent   = `${score} صح`;
      document.getElementById('progressFill').style.width    = `${(currentIndex / total) * 100}%`;
      document.getElementById('questionWeekTag').textContent = `${currentQuiz.title} — ${currentQuiz.subtitle}`;
      document.getElementById('questionText').textContent    = q.question;

      const grid = document.getElementById('optionsGrid');
      grid.innerHTML = '';
      q.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerHTML = `<span class="option-letter">${['أ','ب','ج','د'][i]}</span><span>${opt}</span>`;
        btn.addEventListener('click', () => selectAnswer(i, btn));
        grid.appendChild(btn);
      });

      document.getElementById('feedbackBox').style.display = 'none';
      document.getElementById('btnNext').style.display     = 'none';
      document.getElementById('questionCard').classList.remove('shake');
    }

    function selectAnswer(index, btn) {
      if (answered) return;
      answered = true;

      const q       = questions[currentIndex];
      const allBtns = document.querySelectorAll('.option-btn');
      allBtns.forEach(b => b.disabled = true);

      const feedbackBox = document.getElementById('feedbackBox');

      if (index === q.answer) {
        score++;
        btn.classList.add('correct');
        feedbackBox.className = 'feedback-box correct';
        feedbackBox.innerHTML = `<span class="feedback-icon">✓</span><div><strong>إجابة صحيحة!</strong><br/>${q.explanation}</div>`;
      } else {
        wrongAnswers.push({ question: q.question, yourAnswer: q.options[index], correct: q.options[q.answer] });
        btn.classList.add('wrong');
        allBtns[q.answer].classList.add('correct');
        feedbackBox.className = 'feedback-box wrong';
        feedbackBox.innerHTML = `<span class="feedback-icon">✗</span><div><strong>إجابة خاطئة.</strong> الإجابة الصحيحة: <strong>${q.options[q.answer]}</strong><br/>${q.explanation}</div>`;
        document.getElementById('questionCard').classList.add('shake');
      }

      feedbackBox.style.display = 'flex';
      document.getElementById('progressScore').textContent = `${score} صح`;

      const btnNext = document.getElementById('btnNext');
      btnNext.style.display = 'block';
      btnNext.textContent   = currentIndex === questions.length - 1 ? 'عرض النتيجة ★' : 'السؤال التالي ←';
    }

    document.getElementById('btnNext').addEventListener('click', () => {
      currentIndex++;
      if (currentIndex >= questions.length) showResult();
      else renderQuestion();
    });

    function showResult() {
      document.getElementById('quizArea').style.display  = 'none';
      const screen = document.getElementById('resultScreen');
      screen.style.display = 'flex';

      const total = questions.length;
      const pct   = Math.round((score / total) * 100);

      let icon, title, msg, cls;
      if (pct >= 80) {
        icon = '🏆'; title = 'ممتاز!';        msg = 'أداء رائع — انت فاهم المادة كويس جداً.';   cls = 'excellent';
      } else if (pct >= 60) {
        icon = '👍'; title = 'كويس!';          msg = 'مش بطال — راجع الأسئلة الغلط وكرر.';       cls = 'good';
      } else {
        icon = '📚'; title = 'تحتاج مراجعة'; msg = 'ارجع للمحاضرة واذاكر تاني — انت تقدر!';    cls = 'weak';
      }

      document.getElementById('resultIcon').textContent  = icon;
      document.getElementById('resultTitle').textContent = title;
      document.getElementById('resultScore').textContent = `${score} / ${total}`;
      document.getElementById('resultMsg').textContent   = msg;
      document.getElementById('resultCard').className    = `result-card ${cls}`;

      // Breakdown of wrong answers
      const breakdown = document.getElementById('resultBreakdown');
      if (wrongAnswers.length > 0) {
        breakdown.innerHTML = `
          <div class="breakdown-title">الأسئلة الغلط:</div>
          ${wrongAnswers.map(w => `
            <div class="breakdown-item">
              <div class="breakdown-q">${w.question}</div>
              <div class="breakdown-yours">إجابتك: <span class="wrong-text">${w.yourAnswer}</span></div>
              <div class="breakdown-correct">الصح: <span class="correct-text">${w.correct}</span></div>
            </div>
          `).join('')}
        `;
      } else {
        breakdown.innerHTML = `<div class="breakdown-perfect">🎯 أجبت على كل الأسئلة صح!</div>`;
      }
    }

    document.getElementById('btnRetry').addEventListener('click', () => startQuiz(currentQuiz));
    document.getElementById('btnBackQuizzes').addEventListener('click', () => {
      document.getElementById('resultScreen').style.display    = 'none';
      document.getElementById('heroSection').style.display     = '';
      document.getElementById('selectorSection').style.display = '';
    });
  </script>
</body>
</html>
