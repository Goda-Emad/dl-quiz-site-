<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Applied Deep Learning — Quiz</title>

    <!-- ===== GOOGLE FONTS ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap"
        rel="stylesheet"
    />

    <!-- ===== FONT AWESOME ===== -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- ===== MAIN STYLESHEET ===== -->
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container container--narrow">

        <!-- ======================================================
             HERO HEADER
             ====================================================== -->
        <header class="hero">
            <div class="hero-content">

                <!-- Left: back button + title -->
                <div class="hero-left">
                    <a href="index.html" class="back-btn" title="Back to Home" aria-label="Back to Home">
                        <i class="fa-regular fa-arrow-left"></i>
                    </a>
                    <div class="hero-text">
                        <h1 class="quiz-title" id="quizTitle">Loading…</h1>
                        <span class="subtitle" id="quizSubtitle"></span>
                    </div>
                </div>

                <!-- Right: live stats -->
                <div class="hero-right" id="heroStats">
                    <div class="hero-stat">
                        <span class="number success" id="scoreDisplay">0</span>
                        <span class="label">Score</span>
                    </div>
                    <div class="hero-stat">
                        <span class="number" id="answeredDisplay">0</span>
                        <span class="label">Answered</span>
                    </div>
                    <div class="hero-stat">
                        <span class="number" id="totalDisplay">0</span>
                        <span class="label">Total</span>
                    </div>
                </div>

            </div>
        </header>

        <!-- ======================================================
             QUIZ AREA
             ====================================================== -->
        <main id="quizArea">

            <!-- ── Loading ── -->
            <div id="loadingState" class="loading-state">
                <i class="fa-regular fa-spinner fa-spin"></i>
                <p>Loading questions…</p>
            </div>

            <!-- ── Error ── -->
            <div id="errorState" class="error-state" style="display:none;">
                <i class="fa-regular fa-circle-exclamation"></i>
                <h3>Failed to load quiz</h3>
                <p id="errorMessage" style="margin:6px 0 20px; font-size:0.9rem;">Please check the file path.</p>
                <a href="index.html" class="nav-btn primary" style="display:inline-flex; text-decoration:none;">
                    <i class="fa-regular fa-arrow-left"></i> Back to Home
                </a>
            </div>

            <!-- ── Quiz Content ── -->
            <div id="quizContent" style="display:none;">

                <!-- Jump panel injected by JS above quiz-container -->

                <!-- Quiz card -->
                <div class="quiz-container">

                    <!-- Progress bar -->
                    <div class="progress-section">
                        <div class="progress-header">
                            <span id="progressLabel">Question 1 of 40</span>
                            <span id="progressPercent">0%</span>
                        </div>
                        <div class="progress-track">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                    </div>

                    <!-- Question header -->
                    <div class="question-header">
                        <span class="q-number" id="qNumber">Q1</span>
                        <span class="q-status" id="qStatus">⬜ Not answered</span>
                    </div>

                    <!-- Question text -->
                    <div class="question-text" id="questionText">Loading question…</div>

                    <!-- Options -->
                    <div class="options-grid" id="optionsContainer">
                        <!-- Injected by JS -->
                    </div>

                    <!-- Explanation -->
                    <div class="explanation-box" id="explanationBox">
                        <div class="exp-title" id="expTitle"></div>
                        <div class="exp-body"  id="expBody"></div>
                    </div>

                    <!-- Navigation row -->
                    <div class="nav-section">
                        <button class="nav-btn" id="prevBtn" disabled>
                            <i class="fa-regular fa-arrow-left"></i> Previous
                        </button>
                        <span class="nav-counter" id="navCounter">1 / 40</span>
                        <button class="nav-btn" id="nextBtn">
                            Next <i class="fa-regular fa-arrow-right"></i>
                        </button>
                    </div>

                    <!-- Action row -->
                    <div class="nav-section action-row">
                        <button class="nav-btn success" id="submitBtn">
                            <i class="fa-regular fa-check-circle"></i>
                            Get Final Score &amp; Feedback
                        </button>
                        <button class="nav-btn danger" id="resetBtn">
                            <i class="fa-regular fa-rotate-right"></i> Reset
                        </button>
                    </div>

                </div><!-- /.quiz-container -->

                <!-- Keyboard hint injected by JS below quiz-container -->

                <!-- ── Results panel ── -->
                <div class="results-container" id="resultsContainer">
                    <div class="results-card">

                        <span class="trophy">🏆</span>
                        <div class="score-label">Your Final Score</div>

                        <div class="big-score">
                            <span id="finalScoreNum">0</span><!--
                         --><span class="score-fraction">
                                &thinsp;/&thinsp;<span id="finalScoreTotal">0</span>
                            </span>
                        </div>

                        <div class="results-percentage" id="finalScorePercent">0%</div>

                        <div class="results-stats">
                            <div class="rstat">
                                <span class="rnum green" id="finalCorrect">0</span>
                                <span class="rlabel">✅ Correct</span>
                            </div>
                            <div class="rstat">
                                <span class="rnum red" id="finalWrong">0</span>
                                <span class="rlabel">❌ Incorrect</span>
                            </div>
                            <div class="rstat">
                                <span class="rnum yellow" id="finalUnanswered">0</span>
                                <span class="rlabel">⚠️ Unanswered</span>
                            </div>
                        </div>

                        <div class="results-actions">
                            <button class="nav-btn primary" id="reviewBtn">
                                <i class="fa-regular fa-eye"></i> Review Answers
                            </button>
                            <button class="nav-btn" id="resultsResetBtn">
                                <i class="fa-regular fa-rotate-right"></i> Retry
                            </button>
                            <a href="index.html" class="nav-btn" style="text-decoration:none;">
                                <i class="fa-regular fa-house"></i> Home
                            </a>
                        </div>

                    </div>
                </div><!-- /.results-container -->

            </div><!-- /#quizContent -->

        </main>

    </div><!-- /.container -->

    <!-- ===== MAIN SCRIPT ===== -->
    <script src="main.js"></script>
</body>
</html>
