<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Applied Deep Learning — Exam Hub</title>

    <!-- ===== GOOGLE FONTS ===== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />

    <!-- ===== FONT AWESOME ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- ===== MAIN STYLESHEET ===== -->
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container">

        <!-- ======================================================
             HERO SECTION
             ====================================================== -->
        <header class="hero">
            <div class="hero-content">
                <div class="hero-text">
                    <h1>
                        🧠 Applied<br />
                        <span class="highlight">Deep Learning</span>
                    </h1>
                    <p>
                        Interactive exam hub — weekly MCQ quizzes &amp; graded assessments
                        for the entire course.
                    </p>
                </div>
                <div class="hero-stats">
                    <div class="stat">
                        <span class="number" id="totalWeeks">0</span>
                        <span class="label">Weeks</span>
                    </div>
                    <div class="stat">
                        <span class="number" id="totalQuizzes">0</span>
                        <span class="label">Quizzes</span>
                    </div>
                    <div class="stat">
                        <span class="number" id="totalQuestions">0</span>
                        <span class="label">Questions</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- ======================================================
             WEEKLY MCQ SECTION
             ====================================================== -->
        <section>
            <div class="section-header">
                <h2>
                    <i class="fa-regular fa-calendar-circle-plus"></i>
                    Weekly MCQs
                </h2>
                <span class="badge-count" id="weekBadge">0 files</span>
            </div>
            <div class="card-grid" id="weekGrid">
                <!-- cards injected by JavaScript -->
            </div>
        </section>

        <hr class="section-divider" />

        <!-- ======================================================
             GRADED QUIZZES SECTION
             ====================================================== -->
        <section>
            <div class="section-header">
                <h2>
                    <i class="fa-regular fa-pen-to-square"></i>
                    Graded Quizzes
                </h2>
                <span class="badge-count" id="quizBadge">0 files</span>
            </div>
            <div class="card-grid" id="quizGrid">
                <!-- cards injected by JavaScript -->
            </div>
        </section>

    </div><!-- /.container -->

    <!-- ======================================================
         JAVASCRIPT
         ====================================================== -->
    <script>
    (function () {
        'use strict';

        // ── DATA REGISTRY ──────────────────────────────────────
        const registry = {
            weeks: [
                { file: 'week1.json',  label: 'Week 1',  subtitle: 'Foundations of Deep Learning' },
                { file: 'week2.json',  label: 'Week 2',  subtitle: 'Feed-Forward Networks' },
                { file: 'week3.json',  label: 'Week 3',  subtitle: 'Preventing Overfitting' },
                { file: 'week4.json',  label: 'Week 4',  subtitle: 'Advanced Optimizers &amp; Hyperparameter Tuning' },
                { file: 'week5.json',  label: 'Week 5',  subtitle: 'CNN Architecture' },
                { file: 'week6.json',  label: 'Week 6',  subtitle: 'Applied DL – CNN Architectures &amp; Transfer Learning' },
                { file: 'week7.json',  label: 'Week 7',  subtitle: 'RNNs – Sequential Data' },
                { file: 'week8.json',  label: 'Week 8',  subtitle: 'Model Evaluation &amp; Metrics' },
                { file: 'week9.json',  label: 'Week 9',  subtitle: 'Autoencoders' },
                { file: 'week10.json', label: 'Week 10', subtitle: 'Variational Autoencoders' },
                { file: 'week11.json', label: 'Week 11', subtitle: 'Generative Adversarial Networks' },
                { file: 'week12.json', label: 'Week 12', subtitle: 'Attention Mechanisms' }
            ],
            quizzes: [
                { file: 'quiz1.json', label: 'Quiz 1', subtitle: 'Weeks 1–2 · Foundations &amp; Feed-Forward' },
                { file: 'quiz2.json', label: 'Quiz 2', subtitle: 'Week 3 · Preventing Overfitting' },
                { file: 'quiz4.json', label: 'Quiz 4', subtitle: 'Week 5 · CNN Part 1' },
                { file: 'quiz5.json', label: 'Quiz 5', subtitle: 'Week 6 · CNN Part 2' },
                { file: 'quiz6.json', label: 'Quiz 6', subtitle: 'Week 7 · RNNs' },
                { file: 'quiz7.json', label: 'Quiz 7', subtitle: 'Week 8 · Evaluation Metrics' }
            ]
        };

        // ── DOM REFS ────────────────────────────────────────────
        const weekGrid      = document.getElementById('weekGrid');
        const quizGrid      = document.getElementById('quizGrid');
        const weekBadge     = document.getElementById('weekBadge');
        const quizBadge     = document.getElementById('quizBadge');
        const totalWeeks    = document.getElementById('totalWeeks');
        const totalQuizzes  = document.getElementById('totalQuizzes');
        const totalQuestions= document.getElementById('totalQuestions');

        // ── CARD BUILDER ────────────────────────────────────────
        function buildCard(item, type) {
            const isQuiz = type === 'quiz';
            const card   = document.createElement('div');
            card.className = 'week-card' + (isQuiz ? ' quiz-card' : '');

            const baseFile = item.file.replace('.json', '');
            card.addEventListener('click', function () {
                window.location.href = `quizzes.html?type=${type}&file=${baseFile}`;
            });

            // Top row
            const top = document.createElement('div');
            top.className = 'card-top';

            const badge = document.createElement('span');
            badge.className = 'week-number';
            badge.textContent = isQuiz ? '📝 Quiz' : `📘 ${item.label}`;

            const qCount = document.createElement('span');
            qCount.className = 'question-count';
            qCount.textContent = '— Q';

            top.appendChild(badge);
            top.appendChild(qCount);
            card.appendChild(top);

            // Title
            const title = document.createElement('h3');
            title.textContent = item.label;
            card.appendChild(title);

            // Subtitle
            const sub = document.createElement('div');
            sub.className = 'card-subtitle';
            sub.innerHTML = item.subtitle;
            card.appendChild(sub);

            // Footer
            const footer = document.createElement('div');
            footer.className = 'card-footer';

            const tag = document.createElement('span');
            tag.className = 'type-tag ' + (isQuiz ? 'quiz' : 'mcq');
            tag.textContent = isQuiz ? 'Graded Quiz' : 'MCQ';

            const arrow = document.createElement('span');
            arrow.className = 'start-arrow';
            arrow.innerHTML = 'Start <i class="fa-regular fa-arrow-right"></i>';

            footer.appendChild(tag);
            footer.appendChild(arrow);
            card.appendChild(footer);

            // Async: fetch real question count
            fetch(`data/${isQuiz ? 'quizzes' : 'mcq'}/${item.file}`)
                .then(r => { if (!r.ok) throw new Error(); return r.json(); })
                .then(data => {
                    if (data && Array.isArray(data.questions)) {
                        const n = data.questions.length;
                        qCount.textContent = `${n} Q`;
                        window._qCounter = (window._qCounter || 0) + n;
                        totalQuestions.textContent = window._qCounter;
                    }
                })
                .catch(() => { qCount.textContent = '? Q'; });

            return card;
        }

        // ── RENDER GRID ─────────────────────────────────────────
        function renderGrid(container, items, type) {
            container.innerHTML = '';
            if (!items || !items.length) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-regular fa-folder-open"></i>
                        <h4>No ${type} files found</h4>
                        <p style="font-size:.85rem;margin-top:4px;">
                            Add JSON files to <code>data/${type === 'week' ? 'mcq' : 'quizzes'}/</code>
                        </p>
                    </div>`;
                return;
            }
            items.forEach(item => container.appendChild(buildCard(item, type)));
        }

        // ── INIT ────────────────────────────────────────────────
        function init() {
            const w = registry.weeks.length;
            const q = registry.quizzes.length;

            totalWeeks.textContent   = w;
            totalQuizzes.textContent = q;
            weekBadge.textContent    = `${w} files`;
            quizBadge.textContent    = `${q} files`;
            totalQuestions.textContent = '…';

            window._qCounter = 0;

            renderGrid(weekGrid,  registry.weeks,   'week');
            renderGrid(quizGrid,  registry.quizzes, 'quiz');
        }

        init();
    })();
    </script>

</body>
</html>
